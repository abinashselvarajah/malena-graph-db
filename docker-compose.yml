# Local Neo4j with the APOC plugin (needed for merging identical components).
# The login below is a throw-away default for local use only: change it for anything reachable from a network.
services:
  neo4j:
    image: neo4j:5.20-community
    ports:
      - "7474:7474"   # browser
      - "7687:7687"   # bolt
    environment:
      NEO4J_AUTH: neo4j/password
      NEO4J_PLUGINS: '["apoc"]'
    volumes:
      - neo4j_data:/data
volumes:
  neo4j_data:
